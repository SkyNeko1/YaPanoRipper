name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Tauri
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri bundles
        working-directory: windows
        run: tauri build --bundles msi nsis

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item windows/src-tauri/target/release/yapanoripper.exe artifacts/YaPanoRipper-portable.exe

          $setup = Get-ChildItem windows/src-tauri/target/release/bundle/nsis -Filter "*setup.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName artifacts/YaPanoRipper-setup.exe
          }

          $msi = Get-ChildItem windows/src-tauri/target/release/bundle/msi -Filter "*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName artifacts/YaPanoRipper.msi
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YaPanoRipper-Windows
          path: artifacts/*

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
